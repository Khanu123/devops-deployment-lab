name: Roll back AWS release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character Git SHA of a previously published known-good release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aws-devops-lab
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    environment: devops-lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release input
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['RELEASE_SHA']), 'Use a full Git SHA'
          assert re.fullmatch(r'[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/devops-lab', os.environ['ECR_URL'])
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Restore immutable known-good image and verify rollout
        run: |
          mkdir -p reports
          set -o pipefail
          DIGEST=$(aws ecr describe-images --repository-name devops-lab --image-ids imageTag="$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          python scripts/deploy.py --image "$ECR_URL@$DIGEST" --version "$RELEASE_SHA" | tee reports/rollback.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: reports/
